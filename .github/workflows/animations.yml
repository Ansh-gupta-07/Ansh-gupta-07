name: Generate GitHub Snake

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Pac-Man SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Rename Pac-Man files
        run: |
          if [ -f "dist/pacman.svg" ]; then
            cp dist/pacman.svg dist/pacman-contribution-graph.svg
            cp dist/pacman.svg dist/pacman-contribution-graph-dark.svg
          elif [ -f "pacman.svg" ]; then
            mkdir -p dist
            cp pacman.svg dist/pacman-contribution-graph.svg
            cp pacman.svg dist/pacman-contribution-graph-dark.svg
          else
            SVG_FILE=$(find . -name "*.svg" | grep -v "dist/" | head -n 1)
            if [ -n "$SVG_FILE" ]; then
              mkdir -p dist
              cp "$SVG_FILE" dist/pacman-contribution-graph.svg
              cp "$SVG_FILE" dist/pacman-contribution-graph-dark.svg
            fi
          fi

      - name: Generate trophy card
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=${{ github.repository_owner }}&theme=tokyonight&no-frame=true&no-bg=true&margin-w=15'
          path: dist/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
